name: Codzienny AI Digest (Pages)

on:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC = 07:30 czasu PL
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # commit seen.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  digest-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Testy jednostkowe
        run: python3 tests/test_digest.py
      - name: Zbierz dzisiejszy digest
        run: python3 -m ai_digest run --out-html docs/index.html --out-md out/digest.md
      - name: Commituj stan (seen.json)
        run: |
          git config user.name "ai-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json && git diff --cached --quiet || git commit -q -m "state: seen $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: d
        uses: actions/deploy-pages@v4
